name: Publish Foundry module
on:
  push:
    branches: [main]
    paths:
      - moonlighter-floor-forge.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ZIP and manifest
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, os
          from pathlib import Path
          manifest = json.loads(Path("module.json").read_text())
          with zipfile.ZipFile("moonlighter-floor-forge.zip") as archive:
              inside = json.loads(archive.read("moonlighter-floor-forge/module.json"))
          assert manifest == inside, "Root module.json does not match packaged module.json"
          version = manifest["version"]
          assert version.replace(".", "").replace("-", "").isalnum(), "Invalid version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag=v{version}", file=output)
          PY
      - name: Publish ZIP as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" moonlighter-floor-forge.zip --clobber
          else
            gh release create "$RELEASE_TAG" moonlighter-floor-forge.zip --title "Moonlighter Floor Forge $RELEASE_TAG" --notes "Foundry VTT v13 experimental module release." --target "$GITHUB_SHA"
          fi
