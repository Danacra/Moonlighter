name: Publish Foundry module

on:
  push:
    branches: [main]
    paths:
      - 'moonlighter-floor-forge/**'
      - '.github/scripts/generate-floor-art.py'
      - 'module.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate remastered modular SVG textures
        shell: bash
        run: |
          python3 .github/scripts/generate-floor-art.py

      - name: Run static checks and tests
        shell: bash
        run: |
          for file in moonlighter-floor-forge/scripts/*.js moonlighter-floor-forge/scripts/*.mjs; do
            node --check "$file"
          done
          for file in moonlighter-floor-forge/tests/*.test.mjs; do
            echo "Checking $file"
            node "$file"
          done

      - name: Validate module and assemble ZIP
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path("module.json").read_text(encoding="utf8"))
          b=json.loads(Path("moonlighter-floor-forge/module.json").read_text(encoding="utf8"))
          assert a["id"] == "moonlighter-floor-forge" == b["id"]
          assert a["version"] == b["version"], "Manifest versions disagree"
          for key in ("esmodules","styles"):
              for name in b.get(key,[]):
                  assert Path("moonlighter-floor-forge",name).is_file(), f"Missing module resource: {name}"
          # Every SVG shipped with the module must parse correctly. The new
          # procedural renderer refers to each by its module-local filename.
          import xml.etree.ElementTree as ET
          assets=Path("moonlighter-floor-forge/assets")
          required=("floor-stone.svg","floor-boss.svg","wall-horizontal.svg",
            "wall-vertical.svg","door-arch.svg","door-arch-v.svg",
            "entrance-rune.svg","boss-rune.svg","portal-glow.svg",
            "pit.svg","pillar.svg","chest-closed.svg","chest-open.svg",
            "fountain.svg","vase.svg","miniboss-rune.svg","corner-stone.svg",
            "floor-hazard.svg","floor-treasure.svg","floor-sanctuary.svg",
            "brazier.svg","crystal.svg","altar.svg","rubble.svg","crate.svg",
            "books.svg","moss.svg","rune-carpet.svg","banner.svg","fungus.svg")
          for name in required:
              file=assets/name
              assert file.is_file(), f"Missing procedural graphic: {name}"
              ET.parse(file)
          for svg in assets.glob("*.svg"):
              ET.parse(svg)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print(f'tag=v{a["version"]}',file=f)
          PY
          zip -q -r moonlighter-floor-forge.zip moonlighter-floor-forge
          unzip -tq moonlighter-floor-forge.zip

      - name: Publish release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" moonlighter-floor-forge.zip --clobber
          else
            gh release create "$RELEASE_TAG" moonlighter-floor-forge.zip \
              --title "Moonlighter Floor Forge $RELEASE_TAG" \
              --notes "Experimental Foundry VTT v13 release. Make a world backup before enabling." \
              --target "$GITHUB_SHA"
          fi
