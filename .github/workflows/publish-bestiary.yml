name: Publish Moonlighter Bestiary
on:
  push:
    branches: [main]
    paths:
      - 'bestiary-module.json'
      - 'moonlighter-bestiary-v0.1.0.zip'
      - '.github/scripts/build-bestiary.py'
      - '.github/workflows/publish-bestiary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate distributable
        shell: bash
        run: |
          python3 .github/scripts/build-bestiary.py
          node --version
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile("moonlighter-bestiary.zip") as z:
              script=z.read("moonlighter-bestiary/scripts/core.mjs")
              assert b"records.length!==98" in script
              manifest=json.loads(z.read("moonlighter-bestiary/module.json"))
              assert manifest["version"]=="0.2.0"
          PY
      - name: Publish bestiary release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: bestiary-v0.2.0
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" moonlighter-bestiary.zip --clobber
          else
            gh release create "$RELEASE_TAG" moonlighter-bestiary.zip --title "Moonlighter Bestiary v0.2.0" --notes "98 creatures, including four new original elite minibosses. The four new creatures currently reuse artwork from existing entries. Back up the Foundry world before importing." --target "$GITHUB_SHA"
          fi
